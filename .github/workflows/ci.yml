name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check server + SDK
        run: |
          node --check src/server.js
          node --check src/gateway/gateway.js
          node --check src/gateway/actions.js
          node --check src/gateway/rendezvous.js
          node --check src/security/security.js
          node --check public/client/world.js
          node --check sdk/js/eldermere.js

      - name: Rendezvous smoke test
        run: npm run demo:meeting

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python SDK
        run: python -m py_compile sdk/python/eldermere.py
