<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IvyRealty.Ai — Admin</title>
<link rel="icon" href="/brand/crypto-doge-v2.webp" />
<link rel="stylesheet" href="/store.css" />
</head>
<body>
<header class="nav"><div class="wrap">
  <a href="/"><img class="wordmark" src="/brand/ivy-realty-wordmark-white.png" alt="IvyRealty.Ai" /></a>
  <nav class="links"><a href="/">← Site</a><a href="/world">World</a></nav>
</div></header>

<section class="wrap">
  <h2>Admin console</h2>
  <div id="login" class="form">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD" />
    <button class="btn btn-gold" id="loginBtn" style="margin-top:12px">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" style="display:none">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 20px">
      <button class="btn" id="freezeBtn">Freeze all bots</button>
      <button class="btn btn-gold" id="demoBtn">Run picnic-bench demo</button>
      <span id="freezeState" class="pill-tag"></span>
      <span id="envState" class="s" style="color:#9aa0ad"></span>
    </div>

    <h3>Create a bot</h3>
    <div class="filters" style="margin-bottom:8px">
      <input id="nbName" placeholder="Bot name" />
      <input id="nbOwner" placeholder="Owner" />
      <select id="nbBrain"><option value="offline">offline brain</option><option value="grok">grok brain</option></select>
      <button class="btn btn-gold" id="createBot">Create + mint token</button>
    </div>
    <div class="msg" id="createMsg"></div>

    <h3 style="margin-top:28px">Bots</h3>
    <div class="lotgrid" id="bots"></div>

    <h3 style="margin-top:28px">Waitlist leads</h3>
    <div id="waitlist" class="form" style="max-width:none"></div>
    <h3 style="margin-top:20px">Brokerage leads</h3>
    <div id="leads" class="form" style="max-width:none"></div>
    <h3 style="margin-top:20px">Audit log</h3>
    <div id="audit" class="form" style="max-width:none;font-size:.8rem"></div>
    <h3 style="margin-top:20px">Moderation log</h3>
    <div id="mod" class="form" style="max-width:none;font-size:.8rem"></div>
  </div>
</section>

<script type="module" src="/admin.js"></script>
</body>
</html>
