<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eldermere — Admin Console</title>
<link rel="icon" href="/client/eldermere-logo.svg" />
<style>
  :root{ --gold:#D4AF37; --bg:#0d1117; --panel:#161b22; --line:#232a33; --ink:#e6e8ec; --mut:#9aa0ad; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .nav{ border-bottom:1px solid var(--line); background:#0b0f14; }
  .wrap{ max-width:1040px; margin:0 auto; padding:16px 20px; }
  .nav .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ height:40px; }
  .links a{ color:var(--mut); text-decoration:none; margin-left:16px; font-size:.9rem; }
  .links a:hover{ color:var(--gold); }
  h2{ margin:18px 0 4px; } h3{ margin:0; color:var(--gold); font-weight:600; }
  .form{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:420px; }
  input,select{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0e141b; color:var(--ink); font-size:.95rem; }
  label{ display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }
  .btn{ cursor:pointer; border:1px solid var(--line); background:#1d242d; color:var(--ink); padding:9px 14px; border-radius:8px; font-size:.9rem; }
  .btn:hover{ border-color:var(--gold); }
  .btn-gold{ background:var(--gold); color:#14110a; border-color:var(--gold); font-weight:600; }
  .btn-ghost{ background:transparent; color:var(--mut); }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters input,.filters select{ width:auto; flex:1; min-width:120px; }
  .lotgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .msg{ font-size:.85rem; color:var(--mut); margin-top:8px; min-height:1em; }
  .pill-tag{ background:#1d242d; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:.8rem; }
  .s{ font-size:.85rem; }
  .row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a href="/world"><img class="wordmark" src="/client/eldermere-logo.svg" alt="Eldermere" /></a>
  <nav class="links"><a href="/world">← World</a></nav>
</div></header>

<section class="wrap">
  <h2>Admin console</h2>
  <div id="login" class="form">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD" />
    <button class="btn btn-gold" id="loginBtn" style="margin-top:12px">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="row" style="align-items:center;margin:14px 0 20px">
      <button class="btn" id="freezeBtn">Freeze all bots (kill-switch)</button>
      <button class="btn btn-gold" id="demoBtn">Run picnic-bench demo</button>
      <span id="freezeState" class="pill-tag"></span>
      <span id="envState" class="s" style="color:var(--mut)"></span>
    </div>

    <h3>Create a bot</h3>
    <div class="filters" style="margin:8px 0 6px">
      <input id="nbName" placeholder="Bot name" />
      <input id="nbOwner" placeholder="Owner" />
      <select id="nbBrain"><option value="offline">offline brain</option><option value="grok">grok brain</option></select>
      <button class="btn btn-gold" id="createBot">Create + mint token</button>
    </div>
    <div class="msg" id="createMsg"></div>

    <h3 style="margin-top:28px">Bots</h3>
    <div class="lotgrid" id="bots"></div>

    <h3 style="margin-top:28px">Waitlist signups</h3>
    <div id="waitlist" class="form" style="max-width:none"></div>
    <h3 style="margin-top:20px">Contact leads</h3>
    <div id="leads" class="form" style="max-width:none"></div>
    <h3 style="margin-top:20px">Audit log</h3>
    <div id="audit" class="form" style="max-width:none;font-size:.8rem"></div>
    <h3 style="margin-top:20px">Moderation log</h3>
    <div id="mod" class="form" style="max-width:none;font-size:.8rem"></div>
  </div>
</section>

<script type="module" src="/admin/admin.js"></script>
</body>
</html>
