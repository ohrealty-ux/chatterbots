<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" role="img" aria-label="Eldermere">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5e4"/>
      <stop offset="0.55" stop-color="#b9d8ae"/>
      <stop offset="1" stop-color="#7fae79"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6f2"/>
      <stop offset="1" stop-color="#cdd6cb"/>
    </linearGradient>
  </defs>
  <!-- mallorn leaf emblem -->
  <g transform="translate(160 44)">
    <!-- outer silver ring -->
    <circle r="33" fill="none" stroke="url(#silver)" stroke-width="1.2" opacity="0.8"/>
    <!-- leaf -->
    <path d="M0 -30 C 14 -16, 16 10, 0 30 C -16 10, -14 -16, 0 -30 Z"
          fill="url(#leaf)" stroke="#5e8a58" stroke-width="1"/>
    <!-- midrib + veins -->
    <path d="M0 -26 L0 26 M0 -14 L9 -20 M0 -14 L-9 -20 M0 -2 L11 -8 M0 -2 L-11 -8 M0 10 L9 5 M0 10 L-9 5"
          fill="none" stroke="#4f7b4a" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    <!-- evening star above the leaf -->
    <g transform="translate(0 -42)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#f4f6f2"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="160" y="110" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="4"
        fill="url(#silver)">ELDERMERE</text>
  <text x="160" y="132" text-anchor="middle"
        font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#9fb59a"
        font-style="italic">a hidden meadow by the silver water</text>
</svg>
