# Public: https://eldermere.abacusai.cloud  →  server_name eldermere.vm.internal
# Open-metaverse deployment (BRAND_NEUTRAL=1): no brokerage branding of any kind.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name eldermere.vm.internal;

    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;
    add_header Cache-Control "max-age=0, s-maxage=60" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
